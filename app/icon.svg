<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Solid Ink Background with rounded corners -->
  <rect width="32" height="32" rx="6" fill="#101426" />
  
  <!-- Warm Paper Margin Sheet inside -->
  <rect x="4" y="4" width="24" height="24" rx="3" fill="#F4F1EA" stroke="#101426" stroke-width="1.5" />
  
  <!-- Left Margin Rule in Cobalt Accent -->
  <line x1="11" y1="4" x2="11" y2="28" stroke="#2B44FF" stroke-width="1.5" />
  
  <!-- Text lines with an highlighted pen wash -->
  <line x1="14" y1="10" x2="24" y2="10" stroke="#101426" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Highlighted finding on second line -->
  <rect x="13" y="14" width="12" height="4" fill="#C5CEFF" rx="1" />
  <line x1="14" y1="16" x2="23" y2="16" stroke="#2B44FF" stroke-width="1.5" stroke-linecap="round" />
  
  <line x1="14" y1="22" x2="20" y2="22" stroke="#101426" stroke-width="1.5" stroke-linecap="round" />
</svg>
